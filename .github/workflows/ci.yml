# Проверки на каждый push в main и на pull request: типы, тесты, сборка, состав пакета.
# Живые тесты на настоящем форуме (pnpm test:live) здесь не запускаются.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # версия pnpm из packageManager в package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Package contents
        run: npm pack --dry-run
