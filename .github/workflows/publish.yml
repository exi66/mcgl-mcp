# Публикация в npm по тегу вида v1.2.3.
#
# Trusted publishing (OIDC): токен не нужен. На npmjs.com в настройках пакета
# mcgl-mcp заведён Trusted Publisher: GitHub Actions, exi66/mcgl-mcp, publish.yml,
# разрешён `npm publish`. npm проверяет, что публикует именно этот workflow,
# и сам добавляет provenance (подтверждение, из какого репозитория собран пакет).
name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC-токен для trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # версия pnpm из packageManager в package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing требует npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semver version (expected v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version
          if [[ "$VERSION" == *-* ]]; then echo "dist_tag=next" >> "$GITHUB_OUTPUT"; else echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; fi

      # prepublishOnly внутри npm publish сам прогонит typecheck, тесты и чистую сборку.
      - run: npm publish --access public --tag ${{ steps.version.outputs.dist_tag }}
