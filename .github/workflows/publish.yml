# Публикация в npm
name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC-токен для trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # версия pnpm из packageManager в package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing требует npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semver version (expected v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version
          if [[ "$VERSION" == *-* ]]; then echo "dist_tag=next" >> "$GITHUB_OUTPUT"; else echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; fi

      # Сборка заранее: npm проверяет bin (dist/entry/stdio.js) до запуска prepublishOnly.
      # prepublishOnly внутри npm publish ещё раз прогонит typecheck, тесты и чистую сборку.
      - run: pnpm build
      - run: npm publish --access public --tag ${{ steps.version.outputs.dist_tag }}
